name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npx eslint src middleware.ts
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://api.example.com
